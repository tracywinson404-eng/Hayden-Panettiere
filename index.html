<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hayden</title>
<style>
body{margin:0;background:#0f0f12}
#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1e1e22;color:#fff;padding:18px 28px;border-radius:14px}
#viewer{display:flex;flex-direction:column;align-items:center;padding:24px 12px;gap:18px}
canvas{background:#fff;max-width:96vw;height:auto;border-radius:4px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<div id="loading">Loading 12 pages...</div>
<div id="viewer"></div>
<script>
const url='./doc.pdf';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
(async()=>{
  const pdf=await pdfjsLib.getDocument(url).promise;
  document.getElementById('loading').style.display='none';
  const v=document.getElementById('viewer');
  for(let i=1;i<=pdf.numPages;i++){
    const p=await pdf.getPage(i);
    const vp=p.getViewport({scale:1.3});
    const c=document.createElement('canvas');
    c.width=vp.width;c.height=vp.height;
    c.style.width=Math.min(vp.width/1.3,860)+'px';
    v.appendChild(c);
    await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  }
})();
</script>
</body>
</html>
